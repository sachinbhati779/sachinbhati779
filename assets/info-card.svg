    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.4s"
      begin="1.4s"
      fill="freeze"
    />
  </text>


  <text
    x="24"
    y="246"
    font-family="monospace"
    font-size="13"
    fill="#58a6ff"
    opacity="0"
  >
    INTERESTS
    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.4s"
      begin="1.5s"
      fill="freeze"
    />
