    Builder &amp; Developer
    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.4s"
      begin="1.2s"
      fill="freeze"
    />
  </text>


  <text
    x="24"
    y="218"
    font-family="monospace"
    font-size="13"
    fill="#58a6ff"
    opacity="0"
