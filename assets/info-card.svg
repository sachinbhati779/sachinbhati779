  <text
    x="116"
    y="246"
    font-family="monospace"
    font-size="12"
    fill="#c9d1d9"
    opacity="0"
  >
    AI • IoT • Robotics
    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.4s"
      begin="1.6s"
      fill="freeze"
    />
  </text>


  <text
    x="116"
    y="265"
    font-family="monospace"
    font-size="12"
    fill="#c9d1d9"
    opacity="0"
  >
    Software • Startups
    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.4s"
      begin="1.7s"
      fill="freeze"
    />
  </text>

  <line
    x1="24"
    y1="282"
    x2="466"
    y2="282"
    stroke="#21262d"
  />

  <!-- Currently -->
  <text
    x="24"
    y="307"
    font-family="monospace"
    font-size="14"
    font-weight="bold"
    fill="#3fb950"
    opacity="0"
  >
    currently:
    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.4s"
      begin="2s"
      fill="freeze"
    />
  </text>

  <text
    x="24"
    y="331"
    font-family="monospace"
    font-size="12"
    fill="#c9d1d9"
    opacity="0"
  >
    &gt; building products
    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.4s"
      begin="2.1s"
      fill="freeze"
    />
  </text>

  <text
    x="24"
    y="351"
    font-family="monospace"
    font-size="12"
