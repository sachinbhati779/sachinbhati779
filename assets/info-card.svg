<svg
  width="490"
  height="390"
  viewBox="0 0 490 390"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>
    <!-- Subtle glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip for terminal content -->
    <clipPath id="cardClip">
      <rect x="1" y="1" width="488" height="388" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect
    width="490"
    height="390"
    rx="15"
    fill="#0d1117"
  />

  <!-- Outer border -->
  <rect
    x="1"
    y="1"
    width="488"
    height="388"
    rx="14"
    fill="none"
    stroke="#30363d"
    stroke-width="2"
  />

  <!-- Terminal top bar -->
  <rect
    x="2"
    y="2"
    width="486"
    height="48"
    rx="13"
    fill="#161b22"
  />

  <line
    x1="2"
    y1="50"
    x2="488"
    y2="50"
    stroke="#30363d"
  />

  <!-- Traffic lights -->
  <circle cx="24" cy="25" r="7" fill="#ff5f56"/>
  <circle cx="46" cy="25" r="7" fill="#ffbd2e"/>
  <circle cx="68" cy="25" r="7" fill="#27c93f"/>

  <!-- Terminal title -->
  <text
    x="88"
    y="31"
    font-family="monospace"
    font-size="15"
    fill="#8b949e"
  >
    sachin@github:~
  </text>

  <!-- Command -->
  <text
    x="24"
    y="82"
    font-family="monospace"
    font-size="15"
    font-weight="bold"
    fill="#3fb950"
  >
    $ whoami
  </text>

  <!-- Cursor -->
  <rect
    x="94"
    y="68"
    width="8"
    height="18"
    fill="#3fb950"
  >
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="3"
    />
  </rect>

  <!-- Name -->
  <text
    x="24"
    y="120"
    font-family="monospace"
    font-size="27"
    font-weight="bold"
    fill="#f0f6fc"
    opacity="0"
  >
    Sachin Bhati
    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.6s"
      begin="0.4s"
      fill="freeze"
    />
  </text>

  <!-- Subtitle -->
  <text
    x="24"
    y="146"
    font-family="monospace"
    font-size="13"
    fill="#8b949e"
    opacity="0"
  >
    Builder | Developer | Tech Enthusiast
    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.5s"
      begin="0.8s"
      fill="freeze"
    />
  </text>

  <line
    x1="24"
    y1="163"
    x2="466"
    y2="163"
    stroke="#21262d"
  />

  <!-- Information -->

  <text
    x="24"
    y="190"
    font-family="monospace"
    font-size="13"
    fill="#58a6ff"
    opacity="0"
  >
    ROLE
    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.4s"
      begin="1.1s"
      fill="freeze"
    />
  </text>

  <text
    x="116"
    y="190"
    font-family="monospace"
    font-size="13"
    fill="#c9d1d9"
    opacity="0"
